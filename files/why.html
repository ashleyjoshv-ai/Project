<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Why use packets?</title></head>
<body>
  <h2>Why use packets?</h2>
  <ul>
    <li>Many people can share the same wire at the same time.</li>
    <li>If one path breaks, packets can take another path.</li>
    <li>If one packet gets lost, only that piece is sent again.</li>
  </ul>
</body>
